volumes:
  pg_data:
  redis_data:
  web_root:
  web_root_nuxt:

services:
#  ui:
#    build:
#      context: ui
#    volumes:
#      - ./ui/app:/app
#      - "web_root:/app/dist:z"
#    hostname: ui
#    restart: "no"
#    env_file: .env

  #  NEW Nuxt UI
  ui:
    build:
      context: ui
    volumes:
      - ./ui/app:/app
      - "web_root:/app/dist:z"
    working_dir: /app
    hostname: ui-nuxt
    restart: "no"
    env_file: .env
    depends_on:
      - api

  api:
    build:
      context: api
      args:
        ENABLE_JUPYTER: ${ENABLE_JUPYTER}
        ENABLE_R: ${ENABLE_R}
    hostname: api
    restart: unless-stopped
    entrypoint: sh -c '/app/entrypoint.sh'
    volumes:
      - ./api/app:/app
      - ./api/notebooks:/notebooks
      #- ./api/notebooks:/data/notebooks
      # - ./api/app/notebook/startup:/root/.ipython/profile_default/startup
      # - ./api/app/notebook/nbextensions/printview:/root/.local/share/jupyter/nbextensions/printview
      - ./api/backups:/vol/backups
      - ./api/static:/vol/web/static:z
      - ./api/media:/vol/web/media:z
      - ./data:/data
      - ./README.md:/app/README.md
      - ./.git:/app/docs/.git
      # - ./api/notebooks:/data/notebooks
      - ./conf/jupyter:/root/.jupyter
      - ./conf/ipython:/root/.ipython
    env_file: .env
    environment:
      - GIT_VERSION=${GIT_VERSION}
      - GIT_BRANCH=${GIT_BRANCH}
      - GIT_LASTCOMMITDATE=${GIT_LASTCOMMITDATE}
    depends_on:
      - db
      - redis

  # Message broker for Celery and cache of the api (see api/app/ldm/settings.py)
  redis:
    image: redis:7-alpine
    hostname: redis
    restart: unless-stopped
    # The tasks and the command output survive a restart of the container, and
    # the cache never throws away a task to make room
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

  # Runs Celery tasks in the background, with the same code and image as the api
  celery:
    build:
      context: api
      args:
        ENABLE_JUPYTER: ${ENABLE_JUPYTER}
        ENABLE_R: ${ENABLE_R}
    hostname: celery
    restart: unless-stopped
    command: celery -A ldm worker -l info
    volumes:
      - ./api/app:/app
      - ./api/media:/vol/web/media:z
      - ./data:/data
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    build:
      context: db
    hostname: db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
