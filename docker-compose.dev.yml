  ui:
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8091:3000"
    command:
      - /bin/sh
      - -c
      - |
        corepack enable
        pnpm install --no-frozen-lockfile
        pnpm dev --host 0.0.0.0 --port 3000

  api:
    build:
      args:
        DEPENDENCIES: dev
    environment:
      - DJANGO_DEBUG=True
      # Allows the tests to run. Never set this on production: the tests create
      # a test database on the connected database server (see api/app/ldm/test_guard.py).
      - LDM_ALLOW_TESTS=1
    ports:
      - "5090:5000"
      - "8890:8888"

  celery:
    build:
      args:
        DEPENDENCIES: dev

  db:
    ports:
      - "54390:5432"
