# Settings for the type check. Run it with `make typecheck` (runs mypy in /app of
# the api container). This file lives in api/app, so changes work without a rebuild.
[mypy]
# Only the importer mappers are checked so far; add more folders one by one
files = importer/mappers
python_version = 3.11
# Django, openpyxl, chardet and others have no type information: treat them as unknown
ignore_missing_imports = True
# Imported project code (e.g. core.models) is read for its types, but its own
# errors are not reported until its folder is added to `files`
follow_imports = silent
# A value that can be None must be checked before it is used
strict_optional = True
